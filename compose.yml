services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce_aftersales
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports: ["${MYSQL_HOST_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: after_sales_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-local-dev-password}
    ports: ["5432:5432"]
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./sql/pgvector_schema.sql:/docker-entrypoint-initdb.d/01-pgvector-schema.sql:ro
      - ./sql/seed_knowledge_base.sql:/docker-entrypoint-initdb.d/02-seed-knowledge-base.sql:ro
      - ./sql/seed_extended_after_sales_knowledge.sql:/docker-entrypoint-initdb.d/03-seed-extended-knowledge.sql:ro
      - ./src/main/resources/agent-knowledge-base/after-sales-knowledge-v2.json:/docker-entrypoint-initdb.d/04-after-sales-knowledge-v2.json:ro
      - ./sql/seed_comprehensive_after_sales_knowledge.sql:/docker-entrypoint-initdb.d/05-seed-comprehensive-after-sales-knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d after_sales_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka-data:/var/lib/kafka/data"]

  agent:
    build: ./python_agent
    command: ["python", "-m", "after_sales_agent.interface.http_server"]
    env_file: ./python_agent/.env
    environment:
      LLM_NATIVE_FUNCTION_CALLING_ENABLED: ${LLM_NATIVE_FUNCTION_CALLING_ENABLED:-true}
      AFTERSALES_JAVA_TOOL_BASE_URL: http://java:8080/api/internal/agent-tools
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AFTER_SALES_REVIEW_IDEMPOTENCY_REDIS_URL: redis://redis:6379/0
      PGVECTOR_DSN: postgresql://postgres:${PGVECTOR_PASSWORD:-local-dev-password}@postgres:5432/after_sales_rag
      RAG_LAYERED_RETRIEVAL_ENABLED: ${RAG_LAYERED_RETRIEVAL_ENABLED:-false}
      RAG_SUFFICIENCY_MIN_CONFIDENCE: ${RAG_SUFFICIENCY_MIN_CONFIDENCE:-0.70}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-3}
      RERANK_MAX_RETRIES: ${RERANK_MAX_RETRIES:-1}
      RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-20}
      RERANK_MAX_CONCURRENCY: ${RERANK_MAX_CONCURRENCY:-4}
      FORMAL_REVIEW_AUTO_APPROVE_ENABLED: ${FORMAL_REVIEW_AUTO_APPROVE_ENABLED:-true}
      FORMAL_REVIEW_MIN_CONFIDENCE: ${FORMAL_REVIEW_MIN_CONFIDENCE:-0.75}
      RERANK_CIRCUIT_FAILURE_THRESHOLD: ${RERANK_CIRCUIT_FAILURE_THRESHOLD:-5}
      RERANK_CIRCUIT_RECOVERY_SECONDS: ${RERANK_CIRCUIT_RECOVERY_SECONDS:-30}
      VISION_DISK_CACHE_PATH: /app/.runtime/vision-cache.sqlite3
      AGENT_HOST: 0.0.0.0
      AGENT_MAX_CONCURRENT_REQUESTS: ${AGENT_MAX_CONCURRENT_REQUESTS:-4}
      AGENT_CONTEXT_MODE: ${AGENT_CONTEXT_MODE:-active}
      AGENT_CONTEXT_WINDOW_TOKENS: ${AGENT_CONTEXT_WINDOW_TOKENS:-8192}
      AGENT_CONTEXT_SAFETY_TOKENS: ${AGENT_CONTEXT_SAFETY_TOKENS:-2048}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-dev-agent-token}
      KNOWLEDGE_PARSE_MAX_REQUEST_BYTES: ${KNOWLEDGE_PARSE_MAX_REQUEST_BYTES:-15029592}
    expose: ["8000"]
    volumes: ["agent-cache:/app/.runtime"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

  review-consumer:
    build: ./python_agent
    command: ["python", "-m", "after_sales_agent.interface.kafka_adapter"]
    env_file: ./python_agent/.env
    environment:
      LLM_NATIVE_FUNCTION_CALLING_ENABLED: ${LLM_NATIVE_FUNCTION_CALLING_ENABLED:-true}
      AFTERSALES_JAVA_TOOL_BASE_URL: http://java:8080/api/internal/agent-tools
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AFTER_SALES_REVIEW_IDEMPOTENCY_REDIS_URL: redis://redis:6379/0
      AFTER_SALES_REVIEW_METRICS_PORT: ${AFTER_SALES_REVIEW_METRICS_PORT:-8001}
      AFTER_SALES_REVIEW_AGENT_TIMEOUT_SECONDS: ${AFTER_SALES_REVIEW_AGENT_TIMEOUT_SECONDS:-60}
      AGENT_CONTEXT_WINDOW_TOKENS: ${AGENT_CONTEXT_WINDOW_TOKENS:-8192}
      AGENT_CONTEXT_SAFETY_TOKENS: ${AGENT_CONTEXT_SAFETY_TOKENS:-2048}
      PGVECTOR_DSN: postgresql://postgres:${PGVECTOR_PASSWORD:-local-dev-password}@postgres:5432/after_sales_rag
      LANGGRAPH_CHECKPOINT_DSN: postgresql://postgres:${PGVECTOR_PASSWORD:-local-dev-password}@postgres:5432/after_sales_rag
      LANGGRAPH_CHECKPOINT_SCHEMA: agent_runtime
      RAG_LAYERED_RETRIEVAL_ENABLED: ${RAG_LAYERED_RETRIEVAL_ENABLED:-false}
      RAG_SUFFICIENCY_MIN_CONFIDENCE: ${RAG_SUFFICIENCY_MIN_CONFIDENCE:-0.70}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-3}
      RERANK_MAX_RETRIES: ${RERANK_MAX_RETRIES:-1}
      RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-20}
      RERANK_MAX_CONCURRENCY: ${RERANK_MAX_CONCURRENCY:-4}
      FORMAL_REVIEW_AUTO_APPROVE_ENABLED: ${FORMAL_REVIEW_AUTO_APPROVE_ENABLED:-true}
      FORMAL_REVIEW_MIN_CONFIDENCE: ${FORMAL_REVIEW_MIN_CONFIDENCE:-0.75}
      RERANK_CIRCUIT_FAILURE_THRESHOLD: ${RERANK_CIRCUIT_FAILURE_THRESHOLD:-5}
      RERANK_CIRCUIT_RECOVERY_SECONDS: ${RERANK_CIRCUIT_RECOVERY_SECONDS:-30}
      VISION_DISK_CACHE_PATH: /app/.runtime/vision-cache.sqlite3
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-dev-agent-token}
    expose: ["8001"]
    volumes: ["agent-cache:/app/.runtime"]
    depends_on:
      java:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

  java:
    build: .
    environment:
      DB_USERNAME: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_aftersales?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      AGENT_BASE_URL: http://agent:8000/api
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-dev-agent-token}
      # Keep the Java admission semaphore aligned with the single Agent
      # instance's HTTP capacity; otherwise the gateway returns 429 before
      # the Agent can use its configured four execution slots.
      AGENT_PER_INSTANCE_MAX_CONCURRENT_REQUESTS: ${AGENT_PER_INSTANCE_MAX_CONCURRENT_REQUESTS:-4}
      AGENT_REVIEW_MINIMUM_CONFIDENCE: ${FORMAL_REVIEW_MIN_CONFIDENCE:-0.75}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGVECTOR_URL: jdbc:postgresql://postgres:5432/after_sales_rag
      PGVECTOR_USERNAME: postgres
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-local-dev-password}
      RAG_LAYERED_RETRIEVAL_ENABLED: ${RAG_LAYERED_RETRIEVAL_ENABLED:-false}
      KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-10485760}
      APP_UPLOAD_DIR: /app/uploads
      PROMETHEUS_BASE_URL: http://prometheus:9090
      GRAFANA_AGENT_URL: http://localhost:3000/d/ecommerce-agent-overview/ecommerce-after-sales-agent-overview
    ports: ["8080:8080"]
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/prometheus/agent-token.txt:/etc/prometheus/secrets/agent-token:ro
      - prometheus-data:/prometheus
    depends_on: [java, agent]

  grafana:
    image: grafana/grafana:12.4.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  mysql-data:
  pgvector-data:
  redis-data:
  kafka-data:
  agent-cache:
  prometheus-data:
  grafana-data:
