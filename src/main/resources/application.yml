server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    uri-encoding: UTF-8
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ecommerce-aftersales
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecommerce_aftersales?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  messages:
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: "${JWT_SECRET:change-this-secret-key-to-at-least-32-bytes-in-production}"
    expire-minutes: 10080
  upload:
    dir: ./uploads
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000/api}
    timeout-millis: ${AGENT_TIMEOUT_MILLIS:90000}
    auto-start: ${AGENT_AUTO_START:false}
    python-command: ${AGENT_PYTHON_COMMAND:python}
    script-path: ${AGENT_SCRIPT_PATH:python_agent/api_server.py}
    working-directory: ${AGENT_WORKING_DIRECTORY:.}
    startup-wait-millis: ${AGENT_STARTUP_WAIT_MILLIS:15000}
  miniapp:
    client:
      environment-code: ${MINIAPP_ENV_CODE:local}
      environment-label: ${MINIAPP_ENV_LABEL:本机开发环境}
      api-path: /api
      request-timeout-millis: 15000
      agent-request-timeout-millis: 90000
      presets:
        - code: lan
          label: 当前局域网调试
          base-origin: ${MINIAPP_LAN_BASE_ORIGIN:http://10.242.0.150:8080}
          recommended: true
      demo-user:
        enabled: true
        phone: 13800138000
        password: 123456
        nickname: 演示用户
      wechat-sandbox:
        enabled: true
        users:
          - openid: sandbox_wx_alice
            code: sandbox_code_alice
            nickname: 沙盒微信-Alice
            avatar-url: ""
            phone: 19900000001
          - openid: sandbox_wx_bob
            code: sandbox_code_bob
            nickname: 沙盒微信-Bob
            avatar-url: ""
            phone: 19900000002
          - openid: sandbox_wx_charlie
            code: sandbox_code_charlie
            nickname: 沙盒微信-Charlie
            avatar-url: ""
            phone: 19900000003
